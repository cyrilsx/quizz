name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/quizz-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/quizz-frontend

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          echo "backend_tag=$(git rev-parse --short HEAD)" | tee -a "$GITHUB_OUTPUT"
          echo "frontend_tag=$(git rev-parse --short HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & push backend image (Jib)
        working-directory: backend
        run: >-
          mvn -B -ntp package -DskipTests jib:build
          -Djib.to.image=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.backend_tag }}
          -Djib.to.tags=latest
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.frontend_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            API_URL=${{ vars.API_URL || 'http://localhost:8080/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-koyeb:
    name: Redeploy on Koyeb
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Redeploy services
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_ACCESS_TOKEN }}
          KOYEB_ORG: ${{ vars.KOYEB_ORG_NAME }}
          BACKEND_SERVICE: ${{ vars.KOYEB_BACKEND_SERVICE }}
          FRONTEND_SERVICE: ${{ vars.KOYEB_FRONTEND_SERVICE }}
        run: |
          set -euo pipefail
          for svc in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            if [ -z "$svc" ]; then
              echo "Skipping empty service name"
              continue
            fi
            echo "Redeploying $svc..."
            curl -sSf -X POST "https://api.koyeb.com/v1/services/${svc}/redeploy" \
              -H "Authorization: Bearer ${KOYEB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"message": "Redeploy from GitHub Actions"}' > /dev/null && echo "$svc redeploy triggered"
          done
