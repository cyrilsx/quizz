openapi: 3.0.1
info:
  title: Quizz Platform API
  description: API for Quizz Platform
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /api/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: string
                example: "JWT token"
  /api/quizzes:
    get:
      summary: Get all quizzes
      responses:
        '200':
          description: List of quizzes
    post:
      summary: Create a new quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizRequest'
      responses:
        '201':
          description: Quiz created
  /api/translations:
    get:
      summary: Get translation
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Translation
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    QuizRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        isPublic:
          type: boolean