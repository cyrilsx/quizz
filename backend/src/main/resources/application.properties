# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/quizzdb
spring.datasource.username=quizzuser
spring.datasource.password=quizzpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret}
jwt.expiration=86400000

# Security
server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# CORS
cors.allowed-origins=http://localhost:4200,https://yourdomain.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# Mistral API
mistral.api.key=your-mistral-api-key
mistral.api.url=https://api.mistral.ai/v1