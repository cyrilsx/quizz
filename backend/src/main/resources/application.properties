# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quizzdb}
spring.datasource.username=${DB_USERNAME:quizzuser}
spring.datasource.password=${DB_PASSWORD:quizzpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security
server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
cors.allowed-methods=${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_HEADERS:*}
cors.max-age=${CORS_MAX_AGE:3600}

# Mistral API
mistral.api.key=${MISTRAL_API_KEY}
mistral.api.url=${MISTRAL_API_URL:https://api.mistral.ai/v1}

# Admin seed user
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}