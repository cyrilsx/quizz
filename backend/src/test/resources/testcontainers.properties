# Testcontainers configuration
# This file contains configuration for Testcontainers when running integration tests

# PostgreSQL container configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/quizz_test
spring.datasource.username=testuser
spring.datasource.password=testpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Redis for tests (unless you have Redis Testcontainer)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging configuration for tests
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO